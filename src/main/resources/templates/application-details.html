<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Details | JobTrack</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="container">
    <div class="heading-actions">
        <h1>Application Details</h1>
    </div>


    <section class="details-panel">
        <h2 th:text="${job.jobTitle}">Job title</h2>

        <div class="detail-row">
            <span class="detail-label">Company</span>
            <span class="detail-value" th:text="${job.companyName}">Company name</span>
        </div>

        <div class="detail-row">
            <span class="detail-label">Status</span>
            <span class="detail-value">
            <span class="status" th:text="${job.status}">APPLIED</span>
        </span>
        </div>

        <div class="detail-row">
            <span class="detail-label">Date applied</span>
            <span class="detail-value"
                  th:text="${job.dateApplied != null ? #temporals.format(job.dateApplied, 'MMM d, yyyy') : 'Not specified'}">
            Not specified
        </span>
        </div>

        <div class="detail-row">
            <span class="detail-label">Follow-up date</span>
            <span class="detail-value"
                  th:text="${job.followUpDate != null ? #temporals.format(job.followUpDate, 'MMM d, yyyy') : 'Not specified'}">
            Not specified
        </span>
        </div>

        <div class="detail-row">
            <span class="detail-label">Job URL</span>
            <span class="detail-value">
            <a th:if="${job.jobUrl != null and !job.jobUrl.isBlank()}"
               th:href="${job.jobUrl}"
               th:text="${job.jobUrl}"
               target="_blank"
               rel="noopener noreferrer">View job posting</a>
            <span th:unless="${job.jobUrl != null and !job.jobUrl.isBlank()}">
                Not specified
            </span>
        </span>
        </div>

        <div class="detail-notes">
            <h3>Notes</h3>
            <p th:if="${job.notes != null and !job.notes.isBlank()}"
               th:text="${job.notes}">Application notes</p>
            <p th:unless="${job.notes != null and !job.notes.isBlank()}">
                No notes added.
            </p>
        </div>

        <div class="details-actions">
            <a class="button"
               th:href="@{/applications/{id}/edit(id=${job.id})}">
                Edit application
            </a>
            <a class="button button-secondary" th:href="@{/}">
                Back to applications
            </a>
        </div>
    </section>

</main>
</body>
</html>
